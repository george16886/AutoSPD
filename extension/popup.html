<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoSPD</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup">
        <header class="header">
            <div class="brand-mark" aria-hidden="true">▶</div>
            <div>
                <h1>AutoSPD</h1>
                <p>YouTube 智慧播放速度</p>
            </div>
        </header>

        <section class="video-card" aria-live="polite">
            <p class="eyebrow">目前影片</p>
            <p id="video-title" class="video-title">正在檢查 YouTube 分頁…</p>
            <p id="video-status" class="video-status">讀取中</p>
            <p id="video-meta" class="video-meta" hidden></p>
        </section>

        <label class="toggle-row" for="auto-speed">
            <span>
                <strong>自動分類調速</strong>
                <small>依影片標題和分類規則套用速度</small>
            </span>
            <input id="auto-speed" type="checkbox">
            <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="toggle-row" for="hide-captions">
            <span>
                <strong>自動關閉 CC 字幕</strong>
                <small>影片開始時關閉 YouTube 自動開啟的字幕</small>
            </span>
            <input id="hide-captions" type="checkbox">
            <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="toggle-row" for="notifications">
            <span>
                <strong>顯示速度提示</strong>
                <small>換影片時在畫面右上角顯示分類和速度</small>
            </span>
            <input id="notifications" type="checkbox">
            <span class="toggle" aria-hidden="true"></span>
        </label>

        <section class="setting">
            <label for="default-speed">未分類影片的預設速度</label>
            <div class="speed-control">
                <input id="default-speed" type="number" min="0.25" max="2" step="0.05" value="1">
                <span>x</span>
                <button id="save-default" class="button button-secondary" type="button">儲存</button>
            </div>
        </section>

        <section class="setting">
            <label for="manual-speed">只套用到目前影片</label>
            <div class="speed-control">
                <input id="manual-speed" type="number" min="0.25" max="2" step="0.05" value="1">
                <span>x</span>
                <button id="apply-manual" class="button" type="button">套用</button>
            </div>
        </section>

        <button id="open-options" class="link-button" type="button">管理分類與關鍵字 →</button>

        <p id="message" class="message" role="status"></p>
        <footer>速度範圍：0.25x–2x</footer>
    </main>
    <script src="popup.js"></script>
</body>
</html>
