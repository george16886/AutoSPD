<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoSPD</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup">
        <header class="header">
            <img class="brand-mark" src="icons/icon32.png" width="32" height="32" alt="">
            <div>
                <h1>AutoSPD</h1>
                <p data-i18n="popupSubtitle"></p>
            </div>
        </header>

        <section class="video-card" aria-live="polite">
            <p class="eyebrow" data-i18n="currentVideo"></p>
            <p id="video-title" class="video-title" data-i18n="checkingTab"></p>
            <p id="video-status" class="video-status" data-i18n="loading"></p>
            <p id="video-meta" class="video-meta" hidden></p>
        </section>

        <section id="channel-rule" class="setting" hidden>
            <label id="channel-rule-label" for="channel-speed" data-i18n="channelRuleDefault"></label>
            <div class="speed-control">
                <input id="channel-speed" type="number" min="0.25" max="2" step="0.05" value="1.5">
                <span>x</span>
                <button id="remove-channel-rule" class="button button-secondary" type="button" data-i18n="remove" hidden></button>
                <button id="save-channel-rule" class="button" type="button" data-i18n="set"></button>
            </div>
        </section>

        <section class="setting">
            <label for="manual-speed" data-i18n="manualLabel"></label>
            <div class="speed-control">
                <input id="manual-slider" class="speed-slider" type="range" min="0.25" max="2" step="0.05" value="1" data-i18n-aria-label="manualLabel">
                <input id="manual-speed" type="number" min="0.25" max="2" step="0.05" value="1">
                <span>x</span>
                <button id="apply-manual" class="button" type="button" data-i18n="apply"></button>
            </div>
        </section>

        <label class="toggle-row" for="auto-speed">
            <span>
                <strong data-i18n="autoSpeedTitle"></strong>
                <small data-i18n="autoSpeedHint"></small>
            </span>
            <input id="auto-speed" type="checkbox">
            <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="toggle-row" for="hide-captions">
            <span>
                <strong data-i18n="hideCaptionsTitle"></strong>
                <small data-i18n="hideCaptionsHint"></small>
            </span>
            <input id="hide-captions" type="checkbox">
            <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="toggle-row" for="notifications">
            <span>
                <strong data-i18n="notificationsTitle"></strong>
                <small data-i18n="notificationsHint"></small>
            </span>
            <input id="notifications" type="checkbox">
            <span class="toggle" aria-hidden="true"></span>
        </label>

        <button id="open-options" class="link-button" type="button" data-i18n="manageCategories"></button>

        <p id="message" class="message" role="status"></p>
        <footer data-i18n="speedRange"></footer>
    </main>
    <script src="i18n.js"></script>
    <script src="yt-categories.js"></script>
    <script src="popup.js"></script>
</body>
</html>
