<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="optionsTitle"></title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main class="page">
        <header class="header">
            <img class="brand-mark" src="icons/icon48.png" width="48" height="48" alt="">
            <div>
                <h1 data-i18n="optionsHeading"></h1>
                <p data-i18n="optionsIntro"></p>
            </div>
        </header>

        <fieldset class="mode-section">
            <legend data-i18n="modeLegend"></legend>
            <label class="mode-option">
                <input type="radio" name="classify-mode" value="keywords">
                <span>
                    <strong data-i18n="modeKeywordsTitle"></strong>
                    <small data-i18n="modeKeywordsHint"></small>
                </span>
            </label>
            <label class="mode-option">
                <input type="radio" name="classify-mode" value="youtube">
                <span>
                    <strong data-i18n="modeYouTubeTitle"></strong>
                    <small data-i18n="modeYouTubeHint"></small>
                </span>
            </label>
            <label class="mode-option">
                <input type="radio" name="classify-mode" value="ai">
                <span>
                    <strong data-i18n="modeAiTitle"></strong>
                    <small data-i18n="modeAiHint"></small>
                </span>
            </label>
            <div id="ai-status" class="ai-status" hidden>
                <span id="ai-status-text"></span>
                <button id="ai-download" class="button button-secondary" type="button" data-i18n="aiDownloadButton" hidden></button>
            </div>
        </fieldset>

        <section id="keyword-section">
            <section class="hint">
                <p data-i18n="keywordHelp"></p>
            </section>

            <div id="category-list" class="category-list"></div>

            <div class="actions">
                <button id="add-category" class="button button-secondary" type="button" data-i18n="addCategory"></button>
                <button id="reset-categories" class="button button-ghost" type="button" data-i18n="resetCategories"></button>
            </div>
        </section>

        <section id="youtube-section">
            <h2 data-i18n="ytSpeedsHeading"></h2>
            <section class="hint">
                <p id="youtube-hint"></p>
            </section>
            <div id="yt-speed-list" class="yt-speed-list"></div>
        </section>

        <section class="channel-section">
            <h2 data-i18n="liveMusicHeading"></h2>
            <p class="section-hint" data-i18n="liveMusicHint"></p>
            <div class="fixed-list">
                <label class="fixed-row">
                    <input id="fixed-live" type="checkbox">
                    <span>
                        <strong data-i18n="fixedLiveTitle"></strong>
                        <small data-i18n="fixedLiveHint"></small>
                    </span>
                </label>
                <label class="fixed-row">
                    <input id="fixed-music" type="checkbox">
                    <span>
                        <strong data-i18n="fixedMusicTitle"></strong>
                        <small data-i18n="fixedMusicHint"></small>
                    </span>
                </label>
                <label class="fixed-row">
                    <input id="replay-enabled" type="checkbox">
                    <span>
                        <strong data-i18n="replayTitle"></strong>
                        <small data-i18n="replayHint"></small>
                    </span>
                    <span class="speed fixed-speed">
                        <input id="replay-speed" type="number" min="0.25" max="2" step="0.05" data-i18n-aria-label="replaySpeedLabel">
                        <span>x</span>
                    </span>
                </label>
            </div>
        </section>

        <section class="channel-section">
            <h2 data-i18n="channelRulesHeading"></h2>
            <p class="section-hint" data-i18n="channelRulesHint"></p>
            <div id="channel-list" class="channel-list"></div>
            <p id="channel-empty" class="section-hint" data-i18n="noChannelRules" hidden></p>
        </section>

        <div class="actions actions-save">
            <span class="spacer"></span>
            <span id="dirty" class="dirty" data-i18n="unsavedChanges" hidden></span>
            <button id="save" class="button" type="button" data-i18n="save"></button>
        </div>
        <p id="message" class="message" role="status"></p>
    </main>

    <template id="category-template">
        <article class="category">
            <div class="category-head">
                <label class="switch" data-i18n-title="enableCategory">
                    <input class="field-enabled" type="checkbox">
                    <span class="toggle" aria-hidden="true"></span>
                    <span class="visually-hidden" data-i18n="enable"></span>
                </label>
                <input class="field-emoji" type="text" maxlength="4" data-i18n-aria-label="iconLabel">
                <input class="field-name" type="text" maxlength="40" data-i18n-placeholder="categoryNameLabel" data-i18n-aria-label="categoryNameLabel">
                <label class="speed">
                    <input class="field-speed" type="number" min="0.25" max="2" step="0.05" data-i18n-aria-label="playbackSpeedLabel">
                    <span>x</span>
                </label>
                <button class="delete button button-ghost" type="button" data-i18n="delete" data-i18n-aria-label="deleteCategory"></button>
            </div>
            <div class="category-body">
                <label>
                    <span data-i18n="keywordsLabel"></span>
                    <textarea class="field-keywords" rows="2" data-i18n-placeholder="keywordsPlaceholder"></textarea>
                </label>
                <label>
                    <span data-i18n="ytCategoryOptional"></span>
                    <select class="field-yt-category"></select>
                </label>
            </div>
        </article>
    </template>

    <template id="channel-template">
        <div class="channel-row">
            <span class="channel-name"></span>
            <label class="speed">
                <input class="field-channel-speed" type="number" min="0.25" max="2" step="0.05" data-i18n-aria-label="channelSpeedLabel">
                <span>x</span>
            </label>
            <button class="delete button button-ghost" type="button" data-i18n="delete"></button>
        </div>
    </template>

    <script src="i18n.js"></script>
    <script src="yt-categories.js"></script>
    <script src="options.js"></script>
</body>
</html>
